<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo List in React</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{
  --bg:#eef2ee; --card:#fbfdfb; --ink:#1b2a22; --muted:#6b7c72; --line:#d5ddd6;
  --accent:#1f6f54; --accent-ink:#fff; --danger:#b3382c; --done:#9aa99f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121a16;--card:#1a251f;--ink:#e6eee8;--muted:#8fa196;--line:#2c3b32;--accent:#4cc29a;--accent-ink:#0c1a14;--danger:#ef7b6e;--done:#5d6e63}
}
:root[data-theme="dark"]{--bg:#121a16;--card:#1a251f;--ink:#e6eee8;--muted:#8fa196;--line:#2c3b32;--accent:#4cc29a;--accent-ink:#0c1a14;--danger:#ef7b6e;--done:#5d6e63}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.add{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
input[type=text]{flex:1;min-width:0;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.filters button{padding:5px 12px;border-radius:99px;font-size:.9rem}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.title{flex:1;min-width:0;overflow-wrap:anywhere}
.done .title{text-decoration:line-through;color:var(--done)}
.actions{display:flex;gap:6px}
.actions button{padding:4px 10px;font-size:.88rem}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
.foot button{border:0;padding:2px 6px;color:var(--muted);text-decoration:underline}
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState } = React;
const html = htm.bind(React.createElement);

/* PROPS: TodoItem receives data (todo) and functions (onToggle, onDelete, onSave)
   from its parent. It never owns the task list itself. */
function TodoItem({ todo, onToggle, onDelete, onSave }) {
  // STATE: local to this component, tracks whether we're editing and the draft text
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(todo.text);

  // EVENT HANDLER: runs when the user saves an edit
  function save() {
    if (draft.trim()) onSave(todo.id, draft.trim());
    else setDraft(todo.text);
    setEditing(false);
  }

  if (editing) {
    return html`<li>
      <input type="text" value=${draft} autoFocus aria-label="Edit task"
        onChange=${e => setDraft(e.target.value)}
        onKeyDown=${e => { if (e.key === "Enter") save(); if (e.key === "Escape") { setDraft(todo.text); setEditing(false); } }} />
      <div class="actions">
        <button class="primary" onClick=${save}>Save</button>
        <button onClick=${() => { setDraft(todo.text); setEditing(false); }}>Cancel</button>
      </div>
    </li>`;
  }

  return html`<li class=${todo.done ? "done" : ""}>
    <input type="checkbox" checked=${todo.done} onChange=${() => onToggle(todo.id)} aria-label="Mark done" />
    <span class="title">${todo.text}</span>
    <div class="actions">
      <button onClick=${() => setEditing(true)}>Edit</button>
      <button class="danger" onClick=${() => onDelete(todo.id)}>Delete</button>
    </div>
  </li>`;
}

/* A second component driven entirely by props: it shows the current filter
   and tells the parent when the user picks a different one. */
function FilterBar({ filter, onChange }) {
  return html`<div class="filters" role="group" aria-label="Filter tasks">
    ${["all", "active", "done"].map(f => html`
      <button key=${f} aria-pressed=${filter === f} onClick=${() => onChange(f)}>
        ${f[0].toUpperCase() + f.slice(1)}
      </button>`)}
  </div>`;
}

function App() {
  // STATE lives in the component that needs to share it: the parent.
  const [todos, setTodos] = useState([
    { id: 1, text: "Read the React docs on state", done: true },
    { id: 2, text: "Pass props to a child component", done: false },
    { id: 3, text: "Handle a click event", done: false },
  ]);
  const [text, setText] = useState("");
  const [filter, setFilter] = useState("all");

  // ADD: never mutate state; build a new array and hand it to the setter.
  function addTodo(e) {
    e.preventDefault();               // stop the browser's default form submit
    if (!text.trim()) return;
    setTodos([...todos, { id: Date.now(), text: text.trim(), done: false }]);
    setText("");
  }
  const toggleTodo = id => setTodos(todos.map(t => t.id === id ? { ...t, done: !t.done } : t));
  const editTodo   = (id, newText) => setTodos(todos.map(t => t.id === id ? { ...t, text: newText } : t));
  const deleteTodo = id => setTodos(todos.filter(t => t.id !== id));

  // DERIVED DATA: computed from state on each render, not stored separately.
  const visible = todos.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
  const remaining = todos.filter(t => !t.done).length;
  const hasDone = todos.some(t => t.done);

  return html`<main class="wrap">
    <h1>Tasks</h1>
    <p class="sub">Add, edit, delete and filter. Every change flows through state.</p>
    <div class="card">
      <form class="add" onSubmit=${addTodo}>
        <input type="text" value=${text} placeholder="What needs doing?" aria-label="New task"
          onChange=${e => setText(e.target.value)} />
        <button class="primary" type="submit">Add task</button>
      </form>
      <${FilterBar} filter=${filter} onChange=${setFilter} />
      ${visible.length === 0
        ? html`<div class="empty">${todos.length === 0 ? "No tasks yet. Add your first one above." : "Nothing in this view."}</div>`
        : html`<ul>${visible.map(t => html`
            <${TodoItem} key=${t.id} todo=${t} onToggle=${toggleTodo} onDelete=${deleteTodo} onSave=${editTodo} />`)}
          </ul>`}
      <div class="foot">
        <span>${remaining} ${remaining === 1 ? "task" : "tasks"} left</span>
        ${hasDone && html`<button onClick=${() => setTodos(todos.filter(t => !t.done))}>Clear completed</button>`}
      </div>
    </div>
  </main>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
